name: Avondeditie samenstellen

on:
  schedule:
    - cron: "30 16 * * *"   # 16:30 UTC = 17:30 (winter) / 18:30 (zomer); GitHub start vaak iets later
  workflow_dispatch:        # handmatig starten kan via het Actions-tabblad

permissions:
  contents: write

concurrency:
  group: avondeditie
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nieuws ophalen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_feed.py
      - name: Opslaan
        run: |
          git config user.name "avondeditie-bot"
          git config user.email "avondeditie-bot@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet || git commit -m "Avondeditie $(date -u +%Y-%m-%d)"
          git push
